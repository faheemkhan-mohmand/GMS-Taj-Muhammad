    <!-- ─────────────────────────────────────────────────────────────────────
         WEB FONTS — loaded here, non-render-blocking, NOT from index.css
         ─────────────────────────────────────────────────────────────────────
         This request used to be a CSS @import at the top of index.css, which
         made it a serial, render-blocking step: download CSS → parse → fetch
         the Google Fonts CSS → THEN paint. On a slow or restricted mobile
         connection that chain left users staring at a blank page for many
         seconds, which is the "stuck / hanging" feeling this fixes.

         `media="print"` makes the browser treat this stylesheet as
         low-priority and non-render-blocking; the onload handler then flips it
         to `all` once it has actually arrived. The page therefore paints
         immediately in the system font stack (declared in the critical inline
         CSS below) and upgrades to the web fonts whenever they load.
         display=swap means text is NEVER invisible waiting on a font.

         If fonts.googleapis.com is slow or unreachable — common on some
         Pakistani mobile networks — nothing hangs and nothing breaks: the site
         simply stays on the system fonts. That is exactly the behaviour we
         want, and it is impossible with a CSS @import.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- PLAUSIBLE_INJECT_PLACEHOLDER - Analytics with SRI for integrity -->

    <!-- Fonts are loaded via @import in src/index.css with display=swap -->

    <!-- Inline critical colors keep the first paint aligned with the stored/system theme. -->
    <style>
      :root { --bg: #FAFDF7; --text-primary: #1A2E22; }
      :root[data-theme="dark"] { --bg: #0B1F14; --text-primary: #E8F5EC; }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        background: var(--bg, #FAFDF7);
        color: var(--text-primary, #1A2E22);
      }
      #root { min-height: 100vh; }
    </style>

    <!-- Theme bootstrap runs before paint: saved bright/dark overrides system preference. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('gms-theme');
          var root = document.documentElement;
          var isDark = t === 'dark' || t === 'midnight' || t === 'lantern' ||
            (!(t === 'bright' || t === 'light') && window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.dataset.theme = isDark ? 'dark' : 'bright';
          root.classList.toggle('dark', isDark);
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', isDark ? '#0B1F14' : '#FAFDF7');
          root.classList.remove('theme-midnight','theme-forest','theme-violet','theme-lantern');
        } catch (e) {}
      })();
    </script>
